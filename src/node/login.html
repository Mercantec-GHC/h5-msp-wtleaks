<!DOCTYPE html>
<html>
    <head>
        <title>WTLeaks</title>
        <link rel="stylesheet" href="style.css">
        <script src="/socket.io/socket.io.js"></script>
        <script defer src="/login_client.js"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    </head>
    <body>
        <div id="loginDiv" class="CentreDiv">
            <div id="loginForm" class="LoginContainer">
                <div class="FormPair">
                    <label for="loginUsername">Brugernavn</label>
                    <input id="loginUsername" type="text">
                </div>
                <div class="FormPair">
                    <label for="loginPassword">Adgangskode</label>
                    <input id="loginPassword" type="password">
                </div>
                <button class="FormButton" onclick="TryLogIn()">Log ind</button>
                <div>
                    <span>Har du ikke en bruger? </span>
                    <span class="RegisterSpan" onclick="SwapForms()">Opret ny bruger</span>
                </div>
            </div>

            <div id="registerForm" class="LoginContainer Hidden">
                <div class="FormPair">
                    <label for="registerUsername">Brugernavn</label>
                    <input id="registerUsername" type="text">
                </div>
                <div class="FormPair">
                    <label for="registerDisplayname">Synligt navn</label>
                    <input id="registerDisplayname" type="text">
                </div>
                <div class="FormPair">
                    <label for="registerPassword">Adgangskode</label>
                    <input id="registerPassword" type="password">
                </div>
                <button class="FormButton" onclick="TryRegister()">Opret ny bruger</button>
                <div>
                    <span>Har du allerede en bruger? </span>
                    <span class="RegisterSpan" onclick="SwapForms()">Log ind</span>
                </div>
            </div>
        </div>
    </body>
</html>
